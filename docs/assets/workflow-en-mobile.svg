<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1170" viewBox="0 0 480 1170" role="img" aria-labelledby="title desc">
<title id="title">Set up your project, then choose how to work</title>
<desc id="desc">Everyday development: Open your AI CLI → Ask /work → Implement &amp; test / Work with tests: Create a plan → Implement → Test &amp; repair → Approve &amp; apply / Improve workflows: Propose a change → Evaluate → Compare → Approve &amp; adopt</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
<rect width="480" height="1170" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif">
<text x="28" y="40" font-size="13" fill="#94a3b8" font-weight="600">SELF-EVOLVE-HARNESS</text>
<text x="28" y="77" font-size="18" fill="#f8fafc" font-weight="600">Set up your project, then choose how to work</text>
<rect x="28" y="100" width="424" height="100" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#475569"/>
<text x="48" y="126" font-size="11" fill="#93c5fd" font-weight="700">SETUP</text>
<text x="48" y="155" font-size="18" fill="#f8fafc" font-weight="600">One shared setup for your AI tools.</text>
<text x="48" y="181" font-size="14" fill="#cbd5e1" font-weight="400">Generate Skills, Agent definitions &amp; instructions</text>
<rect x="28" y="224" width="424" height="288" rx="16" fill="#f8fafc"/>
<rect x="48" y="244" width="92" height="25" rx="12.5" fill="#ecfdf5" stroke="#34d399"/>
<text x="61" y="261" font-size="11" fill="#064e3b" font-weight="700">FAST</text>
<text x="48" y="301" font-size="23" fill="#0f172a" font-weight="700">Everyday development</text>
<text x="48" y="326" font-size="14" fill="#475569" font-weight="400">Start working in your usual AI CLI.</text>
<path d="M61 358 V440" stroke="#34d399" stroke-width="2"/>
<circle cx="61" cy="361" r="11" fill="#064e3b"/>
<text x="57.6" y="365" font-size="11" fill="#fff" font-weight="600">1</text>
<text x="84" y="367" font-size="17" fill="#0f172a" font-weight="500">Open your AI CLI</text>
<circle cx="61" cy="399" r="11" fill="#064e3b"/>
<text x="57.6" y="403" font-size="11" fill="#fff" font-weight="600">2</text>
<text x="84" y="405" font-size="17" fill="#0f172a" font-weight="500">Ask /work</text>
<circle cx="61" cy="437" r="11" fill="#064e3b"/>
<text x="57.6" y="441" font-size="11" fill="#fff" font-weight="600">3</text>
<text x="84" y="443" font-size="17" fill="#0f172a" font-weight="500">Implement &amp; test</text>
<path d="M48 467 H432" stroke="#e2e8f0"/>
<text x="48" y="492" font-size="13" fill="#475569" font-weight="400">No extra optimization calls</text>
<rect x="28" y="532" width="424" height="288" rx="16" fill="#f8fafc"/>
<rect x="48" y="552" width="92" height="25" rx="12.5" fill="#eff6ff" stroke="#60a5fa"/>
<text x="61" y="569" font-size="11" fill="#1e3a8a" font-weight="700">VERIFIED</text>
<text x="48" y="609" font-size="23" fill="#0f172a" font-weight="700">Work with tests</text>
<text x="48" y="634" font-size="14" fill="#475569" font-weight="400">Take complex changes from plan to apply.</text>
<path d="M61 666 V748" stroke="#60a5fa" stroke-width="2"/>
<circle cx="61" cy="669" r="11" fill="#1e3a8a"/>
<text x="57.6" y="673" font-size="11" fill="#fff" font-weight="600">1</text>
<text x="84" y="675" font-size="17" fill="#0f172a" font-weight="500">Create a plan</text>
<circle cx="61" cy="707" r="11" fill="#1e3a8a"/>
<text x="57.6" y="711" font-size="11" fill="#fff" font-weight="600">2</text>
<text x="84" y="713" font-size="17" fill="#0f172a" font-weight="500">Implement → Test &amp; repair</text>
<circle cx="61" cy="745" r="11" fill="#1e3a8a"/>
<text x="57.6" y="749" font-size="11" fill="#fff" font-weight="600">3</text>
<text x="84" y="751" font-size="17" fill="#0f172a" font-weight="500">Approve &amp; apply</text>
<path d="M48 775 H432" stroke="#e2e8f0"/>
<text x="48" y="800" font-size="13" fill="#475569" font-weight="400">Choose hosts &amp; models per task</text>
<rect x="28" y="840" width="424" height="288" rx="16" fill="#f8fafc"/>
<rect x="48" y="860" width="92" height="25" rx="12.5" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="61" y="877" font-size="11" fill="#4c1d95" font-weight="700">OPTIMIZE</text>
<text x="48" y="917" font-size="23" fill="#0f172a" font-weight="700">Improve workflows</text>
<text x="48" y="942" font-size="14" fill="#475569" font-weight="400">Refine your process with evaluation.</text>
<path d="M61 974 V1056" stroke="#a78bfa" stroke-width="2"/>
<circle cx="61" cy="977" r="11" fill="#4c1d95"/>
<text x="57.6" y="981" font-size="11" fill="#fff" font-weight="600">1</text>
<text x="84" y="983" font-size="17" fill="#0f172a" font-weight="500">Propose a change</text>
<circle cx="61" cy="1015" r="11" fill="#4c1d95"/>
<text x="57.6" y="1019" font-size="11" fill="#fff" font-weight="600">2</text>
<text x="84" y="1021" font-size="17" fill="#0f172a" font-weight="500">Evaluate → Compare</text>
<circle cx="61" cy="1053" r="11" fill="#4c1d95"/>
<text x="57.6" y="1057" font-size="11" fill="#fff" font-weight="600">3</text>
<text x="84" y="1059" font-size="17" fill="#0f172a" font-weight="500">Approve &amp; adopt</text>
<path d="M48 1083 H432" stroke="#e2e8f0"/>
<text x="48" y="1108" font-size="13" fill="#475569" font-weight="400">Run on demand · OFF by default</text>
<text x="28" y="1147" font-size="12" fill="#94a3b8" font-weight="600">CLAUDE CODE  /  CODEX  /  OPENCODE</text>
</g></svg>
