<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="596" viewBox="0 0 1080 596" role="img" aria-labelledby="title desc">
<title id="title">プロジェクトに導入して、作業に合う進め方を選ぶ</title>
<desc id="desc">普段の開発: AI CLIを起動 → /work で依頼 → 実装・テスト / テスト付きの作業: 計画を作成 → 実装 → テスト・修正 → 承認して適用 / 開発手順の改善: 変更候補を作成 → 評価 → 比較 → 承認して採用</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
<rect width="1080" height="596" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif">
<text x="28" y="40" font-size="13" fill="#94a3b8" font-weight="600">SELF-EVOLVE-HARNESS</text>
<text x="28" y="77" font-size="24" fill="#f8fafc" font-weight="600">プロジェクトに導入して、作業に合う進め方を選ぶ</text>
<rect x="28" y="100" width="1024" height="100" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#475569"/>
<text x="48" y="126" font-size="11" fill="#93c5fd" font-weight="700">SETUP</text>
<text x="48" y="155" font-size="24" fill="#f8fafc" font-weight="600">共通の開発環境を、一度で。</text>
<text x="48" y="181" font-size="14" fill="#cbd5e1" font-weight="400">Skill・Agent・指示ファイルを生成</text>
<path d="M540 200 V219 M194 242 V219 H886 V242 M540 219 V242" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="28" y="242" width="332" height="288" rx="16" fill="#f8fafc"/>
<rect x="48" y="262" width="92" height="25" rx="12.5" fill="#ecfdf5" stroke="#34d399"/>
<text x="61" y="279" font-size="11" fill="#064e3b" font-weight="700">FAST</text>
<text x="48" y="319" font-size="22" fill="#0f172a" font-weight="700">普段の開発</text>
<text x="48" y="344" font-size="14" fill="#475569" font-weight="400">いつものAI CLIから、すぐに作業。</text>
<path d="M61 376 V458" stroke="#34d399" stroke-width="2"/>
<circle cx="61" cy="379" r="11" fill="#064e3b"/>
<text x="57.6" y="383" font-size="11" fill="#fff" font-weight="600">1</text>
<text x="84" y="385" font-size="17" fill="#0f172a" font-weight="500">AI CLIを起動</text>
<circle cx="61" cy="417" r="11" fill="#064e3b"/>
<text x="57.6" y="421" font-size="11" fill="#fff" font-weight="600">2</text>
<text x="84" y="423" font-size="17" fill="#0f172a" font-weight="500">/work で依頼</text>
<circle cx="61" cy="455" r="11" fill="#064e3b"/>
<text x="57.6" y="459" font-size="11" fill="#fff" font-weight="600">3</text>
<text x="84" y="461" font-size="17" fill="#0f172a" font-weight="500">実装・テスト</text>
<path d="M48 485 H340" stroke="#e2e8f0"/>
<text x="48" y="510" font-size="13" fill="#475569" font-weight="400">追加の最適化呼び出しなし</text>
<rect x="374" y="242" width="332" height="288" rx="16" fill="#f8fafc"/>
<rect x="394" y="262" width="92" height="25" rx="12.5" fill="#eff6ff" stroke="#60a5fa"/>
<text x="407" y="279" font-size="11" fill="#1e3a8a" font-weight="700">VERIFIED</text>
<text x="394" y="319" font-size="22" fill="#0f172a" font-weight="700">テスト付きの作業</text>
<text x="394" y="344" font-size="14" fill="#475569" font-weight="400">複雑な変更を、計画から適用まで。</text>
<path d="M407 376 V458" stroke="#60a5fa" stroke-width="2"/>
<circle cx="407" cy="379" r="11" fill="#1e3a8a"/>
<text x="403.6" y="383" font-size="11" fill="#fff" font-weight="600">1</text>
<text x="430" y="385" font-size="17" fill="#0f172a" font-weight="500">計画を作成</text>
<circle cx="407" cy="417" r="11" fill="#1e3a8a"/>
<text x="403.6" y="421" font-size="11" fill="#fff" font-weight="600">2</text>
<text x="430" y="423" font-size="17" fill="#0f172a" font-weight="500">実装 → テスト・修正</text>
<circle cx="407" cy="455" r="11" fill="#1e3a8a"/>
<text x="403.6" y="459" font-size="11" fill="#fff" font-weight="600">3</text>
<text x="430" y="461" font-size="17" fill="#0f172a" font-weight="500">承認して適用</text>
<path d="M394 485 H686" stroke="#e2e8f0"/>
<text x="394" y="510" font-size="13" fill="#475569" font-weight="400">ホスト・モデルをタスクごとに選択</text>
<rect x="720" y="242" width="332" height="288" rx="16" fill="#f8fafc"/>
<rect x="740" y="262" width="92" height="25" rx="12.5" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="753" y="279" font-size="11" fill="#4c1d95" font-weight="700">OPTIMIZE</text>
<text x="740" y="319" font-size="22" fill="#0f172a" font-weight="700">開発手順の改善</text>
<text x="740" y="344" font-size="14" fill="#475569" font-weight="400">評価結果をもとに、手順を磨く。</text>
<path d="M753 376 V458" stroke="#a78bfa" stroke-width="2"/>
<circle cx="753" cy="379" r="11" fill="#4c1d95"/>
<text x="749.6" y="383" font-size="11" fill="#fff" font-weight="600">1</text>
<text x="776" y="385" font-size="17" fill="#0f172a" font-weight="500">変更候補を作成</text>
<circle cx="753" cy="417" r="11" fill="#4c1d95"/>
<text x="749.6" y="421" font-size="11" fill="#fff" font-weight="600">2</text>
<text x="776" y="423" font-size="17" fill="#0f172a" font-weight="500">評価 → 比較</text>
<circle cx="753" cy="455" r="11" fill="#4c1d95"/>
<text x="749.6" y="459" font-size="11" fill="#fff" font-weight="600">3</text>
<text x="776" y="461" font-size="17" fill="#0f172a" font-weight="500">承認して採用</text>
<path d="M740 485 H1032" stroke="#e2e8f0"/>
<text x="740" y="510" font-size="13" fill="#475569" font-weight="400">必要なときだけ実行 · 初期OFF</text>
<text x="28" y="573" font-size="12" fill="#94a3b8" font-weight="600">CLAUDE CODE  /  CODEX  /  OPENCODE</text>
