<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1320" viewBox="0 0 560 1320" role="img" aria-labelledby="title desc">
<title id="title">ひとつの依頼を、検証できる変更へ。</title>
<desc id="desc">「フロントエンドとAPIに機能を追加して、テストまで」 → 計画する → 画面を実装 → APIを実装 → 確かめる → 承認して適用.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172a40"/></linearGradient><linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#93c5fd"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7b94b1" stroke-width="1.5"/></marker></defs>
<rect width="560" height="1320" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif">
<text x="32" y="38" font-size="12" fill="#7dd3fc" font-weight="700">AI CODING, WITH A WORKFLOW.</text>
<text x="32" y="88" font-size="36" fill="#f8fafc" font-weight="750">ひとつの依頼を、</text>
<text x="32" y="134" font-size="36" fill="#5eead4" font-weight="750">検証できる変更へ。</text>
<text x="32" y="168" font-size="17" fill="#b7c9dd" font-weight="400">計画・分担・テスト・承認を、ひとつの流れに。</text>
<text x="32" y="203" font-size="12" fill="#7dd3fc" font-weight="600">CLAUDE CODE  /  CODEX  /  OPENCODE</text>
<rect x="24" y="230" width="512" height="96" rx="14" fill="#20344c" stroke="#37516e"/>
<text x="42" y="256" font-size="11" fill="#7dd3fc" font-weight="700">YOUR TASK / 依頼の例</text>
<text x="42" y="284" font-size="19" fill="#fff" font-weight="600">「フロントエンドとAPIに機能を追加して、</text>
<text x="42" y="309" font-size="19" fill="#fff" font-weight="600">テストまで」</text>
<path d="M280 326 V355" fill="none" stroke="#7b94b1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="360" width="512" height="560" rx="14" fill="#f0f5fa" stroke="none"/>
<text x="42" y="391" font-size="11" fill="#52657b" font-weight="700">MANAGED WORKFLOW / タスク定義による分担の例</text>
<rect x="147" y="411" width="266" height="94" rx="14" fill="#fff" stroke="#dbe4ef"/>
<rect x="161" y="425" width="26" height="26" rx="8" fill="#2563eb" stroke="none"/>
<text x="168" y="444" font-size="14" fill="#fff" font-weight="700">1</text>
<text x="197" y="445" font-size="19" fill="#14263e" font-weight="700">計画する</text>
<text x="163" y="482" font-size="14" fill="#52657b" font-weight="400">作業範囲・依存関係</text>
<path d="M280 505 V529 H153 V550" fill="none" stroke="#7b94b1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M280 529 H407 V550" fill="none" stroke="#7b94b1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="556" width="230" height="94" rx="14" fill="#fff" stroke="#dbe4ef"/>
<rect x="56" y="570" width="26" height="26" rx="8" fill="#2563eb" stroke="none"/>
<text x="63" y="589" font-size="14" fill="#fff" font-weight="700">2</text>
<text x="92" y="590" font-size="19" fill="#14263e" font-weight="700">画面を実装</text>
<text x="58" y="627" font-size="14" fill="#52657b" font-weight="400">Codex · model: auto</text>
<rect x="288" y="556" width="230" height="94" rx="14" fill="#fff" stroke="#dbe4ef"/>
<rect x="302" y="570" width="26" height="26" rx="8" fill="#7c3aed" stroke="none"/>
<text x="309" y="589" font-size="14" fill="#fff" font-weight="700">2</text>
<text x="338" y="590" font-size="19" fill="#14263e" font-weight="700">APIを実装</text>
<text x="304" y="627" font-size="14" fill="#52657b" font-weight="400">OpenCode · model: auto</text>
<path d="M157 650 V674 H280 V698" fill="none" stroke="#7b94b1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M403 650 V674 H280" fill="none" stroke="#7b94b1" stroke-width="2"/>
<text x="42" y="695" font-size="12" fill="#52657b" font-weight="400">独立したタスクは並列実行</text>
<rect x="147" y="708" width="266" height="94" rx="14" fill="#fff" stroke="#dbe4ef"/>
<rect x="161" y="722" width="26" height="26" rx="8" fill="#0f766e" stroke="none"/>
<text x="168" y="741" font-size="14" fill="#fff" font-weight="700">3</text>
<text x="197" y="742" font-size="19" fill="#14263e" font-weight="700">確かめる</text>
<text x="163" y="779" font-size="14" fill="#52657b" font-weight="400">テスト・回数制限付き修正</text>
<path d="M280 802 V822" fill="none" stroke="#7b94b1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="147" y="831" width="266" height="66" rx="14" fill="#d1fae5" stroke="#6ee7b7"/>
<text x="166" y="858" font-size="21" fill="#065f46" font-weight="700">承認して適用</text>
<text x="166" y="881" font-size="13" fill="#065f46" font-weight="400">成功した変更を反映</text>
<rect x="24" y="944" width="512" height="146" rx="14" fill="#1c3047" stroke="#37516e"/>
<rect x="42" y="963" width="4" height="30" rx="2" fill="url(#accent)" stroke="none"/>
<text x="60" y="988" font-size="24" fill="#f8fafc" font-weight="700">普段の作業は、もっと軽く。</text>
<text x="44" y="1026" font-size="18" fill="#cbd5e1" font-weight="400">AI CLIで /work → 実装・テスト</text>
<text x="44" y="1072" font-size="13" fill="#7dd3fc" font-weight="400">追加の最適化呼び出しなし</text>
<rect x="24" y="1110" width="512" height="146" rx="14" fill="#1c3047" stroke="#37516e"/>
<rect x="42" y="1129" width="4" height="30" rx="2" fill="url(#accent)" stroke="none"/>
<text x="60" y="1154" font-size="24" fill="#f8fafc" font-weight="700">開発手順も、育てられる。</text>
<text x="44" y="1188" font-size="15" fill="#cbd5e1" font-weight="400">Skill・プロンプトの変更候補 → 評価・比較</text>
<text x="44" y="1210" font-size="15" fill="#cbd5e1" font-weight="400">→ 承認して採用</text>
<text x="44" y="1238" font-size="13" fill="#7dd3fc" font-weight="400">最適化は初期OFF · 自動で採用しない</text>
<text x="24" y="1298" font-size="12" fill="#9cb1ca" font-weight="400">Python以外のプロジェクトも対応 · ローカルメモリ · コード検索</text>
</g></svg>
